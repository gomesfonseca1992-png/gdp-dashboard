<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanceApp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:  #00c896;
      --red:    #ff4d6d;
      --blue:   #4361ee;
      --dark:   #0d1117;
      --card:   #161b22;
      --border: #30363d;
      --text:   #e6edf3;
      --muted:  #8b949e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--green); }

    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 1.25rem;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--text); }

    main { max-width: 1080px; margin: 2rem auto; padding: 0 1rem; }

    .flash-list { margin-bottom: 1.2rem; list-style: none; }
    .flash {
      padding: 0.7rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      margin-bottom: 0.4rem;
    }
    .flash.success { background: rgba(0,200,150,.15); color: var(--green); border: 1px solid rgba(0,200,150,.3); }
    .flash.error   { background: rgba(255,77,109,.15); color: var(--red);   border: 1px solid rgba(255,77,109,.3); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: filter 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:hover  { filter: brightness(1.12); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-primary   { background: var(--blue);  color: #fff; }
    .btn-success   { background: var(--green); color: #0d1117; }
    .btn-danger    { background: var(--red);   color: #fff; }
    .btn-ghost     { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.8rem; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input, select {
      width: 100%;
      padding: 0.55rem 0.8rem;
      background: var(--dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--blue); }
    input::placeholder { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="logo">Finance<span>App</span></div>
    <nav>
      <a href="{{ url_for('index') }}">Dashboard</a>
      <a href="{{ url_for('create') }}">+ Novo lançamento</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-list">
          {% for category, message in messages %}
            <li class="flash {{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
