{% extends "base.html" %}
{% block content %}

<div style="max-width:540px; margin:0 auto;">
  <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.25rem;">
    <a href="{{ url_for('index') }}" class="btn btn-ghost btn-sm">← Voltar</a>
    <h2 style="font-size:1.2rem; font-weight:700;">{{ action }} lançamento</h2>
  </div>

  <div class="card">
    <form method="POST" id="finance-form">

      <!-- Tipo -->
      <div style="margin-bottom:1.1rem;">
        <label>Tipo *</label>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:.75rem;">
          <label style="text-transform:none; font-size:.95rem; cursor:pointer;
                        display:flex; align-items:center; gap:.5rem;
                        background:{% if record.tipo == 'receita' %}rgba(0,200,150,.15){% else %}var(--dark){% endif %};
                        border:1px solid {% if record.tipo == 'receita' %}var(--green){% else %}var(--border){% endif %};
                        border-radius:8px; padding:.6rem .9rem; transition:all .2s;"
                 id="label-receita">
            <input type="radio" name="tipo" value="receita"
                   {% if record.tipo == 'receita' %}checked{% endif %}
                   onchange="updateTipo(this.value)"
                   style="width:auto; accent-color:var(--green);" />
            <span style="color:var(--green); font-weight:600;">+ Receita</span>
          </label>
          <label style="text-transform:none; font-size:.95rem; cursor:pointer;
                        display:flex; align-items:center; gap:.5rem;
                        background:{% if record.tipo == 'despesa' %}rgba(255,77,109,.15){% else %}var(--dark){% endif %};
                        border:1px solid {% if record.tipo == 'despesa' %}var(--red){% else %}var(--border){% endif %};
                        border-radius:8px; padding:.6rem .9rem; transition:all .2s;"
                 id="label-despesa">
            <input type="radio" name="tipo" value="despesa"
                   {% if record.tipo == 'despesa' %}checked{% endif %}
                   onchange="updateTipo(this.value)"
                   style="width:auto; accent-color:var(--red);" />
            <span style="color:var(--red); font-weight:600;">- Despesa</span>
          </label>
        </div>
      </div>

      <!-- Categoria -->
      <div style="margin-bottom:1.1rem;">
        <label>Categoria *</label>
        <select name="categoria" id="categoria">
          <option value="">Selecione...</option>
          {% set tipo_atual = record.tipo if record.tipo else 'despesa' %}
          {% for tipo, cats in categories.items() %}
            {% for cat in cats %}
              <option value="{{ cat }}"
                      data-tipo="{{ tipo }}"
                      {% if record.categoria == cat %}selected{% endif %}>
                {{ cat }}
              </option>
            {% endfor %}
          {% endfor %}
        </select>
      </div>

      <!-- Descrição -->
      <div style="margin-bottom:1.1rem;">
        <label>Descrição *</label>
        <input type="text" name="descricao"
               value="{{ record.descricao or '' }}"
               placeholder="Ex: Supermercado, Salário de março..."
               required />
      </div>

      <!-- Valor + Data -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.5rem;">
        <div>
          <label>Valor (R$) *</label>
          <input type="number" name="valor"
                 value="{{ record.valor or '' }}"
                 min="0.01" step="0.01"
                 placeholder="0,00"
                 required />
        </div>
        <div>
          <label>Data *</label>
          <input type="date" name="data"
                 value="{{ record.data or '' }}"
                 required />
        </div>
      </div>

      <div style="display:flex; gap:.75rem; justify-content:flex-end;">
        <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancelar</a>
        <button type="submit" class="btn btn-primary">{{ action }}</button>
      </div>

    </form>
  </div>
</div>

<script>
  const categories = {{ categories | tojson }};

  function updateTipo(tipo) {
    const sel = document.getElementById('categoria');
    const current = sel.value;
    sel.innerHTML = '<option value="">Selecione...</option>';
    (categories[tipo] || []).forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      if (cat === current) opt.selected = true;
      sel.appendChild(opt);
    });

    const lr = document.getElementById('label-receita');
    const ld = document.getElementById('label-despesa');
    if (tipo === 'receita') {
      lr.style.background = 'rgba(0,200,150,.15)';
      lr.style.borderColor = 'var(--green)';
      ld.style.background = 'var(--dark)';
      ld.style.borderColor = 'var(--border)';
    } else {
      ld.style.background = 'rgba(255,77,109,.15)';
      ld.style.borderColor = 'var(--red)';
      lr.style.background = 'var(--dark)';
      lr.style.borderColor = 'var(--border)';
    }
  }

  // Init on load
  const checked = document.querySelector('input[name="tipo"]:checked');
  if (checked) updateTipo(checked.value);
</script>

{% endblock %}
